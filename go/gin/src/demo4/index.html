<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杭电官网丝滑动画复刻</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/ScrollTrigger.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* 背景装饰元素 */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            opacity: 0.05;
            z-index: 0;
        }

        .section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            position: relative;
            overflow: hidden;
        }

        .card {
            opacity: 0;
            transform: translateY(30px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        /* 渐变文字 */
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 进度条 */
        .progress-bar {
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }
    </style>
</head>
<body>

<!-- 滚动进度条 -->
<div class="progress-bar"></div>

<!-- 背景装饰 -->
<div class="bg-circle w-96 h-96 top-20 -left-48"></div>
<div class="bg-circle w-64 h-64 top-40 -right-32" style="background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);"></div>
<div class="bg-circle w-80 h-80 bottom-20 left-1/4" style="background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);"></div>

<!-- 顶部 hero 区 -->
<section class="section w-full bg-gradient-to-b from-blue-50 to-white text-center relative">
    <h1 class="text-[clamp(2rem,5vw,4rem)] font-bold gradient-text mb-6">
        杭州电子科技大学
    </h1>
    <p class="text-lg text-gray-600 max-w-2xl opacity-0 animate-fade-in">
        立足浙江、面向全国、服务信息产业，建设特色鲜明、国内一流、国际知名的高水平大学
    </p>
</section>

<!-- 卡片区 -->
<section class="section w-full py-20 bg-white relative">
    <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="card p-8 bg-white rounded-2xl shadow-lg border border-gray-100">
            <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center mb-4 mx-auto">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                </svg>
            </div>
        </div>
        <div class="card p-8 bg-white rounded-2xl shadow-lg border border-gray-100">
            <div class="w-14 h-14 bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl flex items-center justify-center mb-4 mx-auto">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                </svg>
            </div>
        </div>
        <div class="card p-8 bg-white rounded-2xl shadow-lg border border-gray-100">
            <div class="w-14 h-14 bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-xl flex items-center justify-center mb-4 mx-auto">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
            </div>
        </div>
    </div>
</section>

<!-- 内容区 -->
<section class="section w-full py-20 bg-gradient-to-t from-blue-50 to-white relative">
    <div class="max-w-4xl w-full text-center">
        <h2 class="text-[clamp(2rem,4vw,3.5rem)] font-bold mb-10 gradient-text">
            追求卓越
            <span class="block text-2xl font-normal mt-2 opacity-80">创建双一流</span>
        </h2>
        <p class="text-gray-700 text-lg leading-relaxed opacity-0">
            杭电坚持立德树人，服务国家战略与区域发展，为数字经济提供人才支撑与科技支撑。
        </p>
    </div>
</section>

<!-- 底部信息 -->
<footer class="py-10 text-center text-gray-500 text-sm">
    <p>杭州电子科技大学 © 2024</p>
</footer>

<script>
    // 注册插件
    gsap.registerPlugin(ScrollTrigger);

    // 全局平滑动画配置
    gsap.defaults({
        ease: "power2.out",
        duration: 1.1
    });

    // 滚动进度条
    gsap.to(".progress-bar", {
        width: "100%",
        ease: "none",
        scrollTrigger: {
            trigger: "body",
            start: "top top",
            end: "bottom bottom",
            scrub: 0
        }
    });

    // 背景圆圈浮动动画
    gsap.to(".bg-circle", {
        y: 30,
        x: 20,
        rotation: 15,
        repeat: -1,
        yoyo: true,
        duration: 8,
        stagger: 1,
        ease: "sine.inOut"
    });

    // 区域渐入
    document.querySelectorAll('.section').forEach((el) => {
        gsap.fromTo(el, {
            opacity: 0,
            y: 50
        }, {
            opacity: 1,
            y: 0,
            scrollTrigger: {
                trigger: el,
                start: "top 80%",
                end: "top 30%",
                scrub: 1,
                toggleActions: "play none none reverse"
            }
        });
    });

    // 卡片 stagger 动画
    gsap.to('.card', {
        opacity: 1,
        y: 0,
        scale: 1,
        stagger: 0.2,
        duration: 0.8,
        ease: "back.out(1.7)",
        scrollTrigger: {
            trigger: '.card',
            start: "top 85%",
            toggleActions: "play none none reverse"
        }
    });

    // 文字渐入
    gsap.fromTo('h1, h2, p', {
        opacity: 0,
        y: 30,
        scale: 0.95
    }, {
        opacity: 1,
        y: 0,
        scale: 1,
        stagger: 0.2,
        duration: 1,
        ease: "power3.out",
        scrollTrigger: {
            trigger: 'h1',
            start: "top 80%",
            toggleActions: "play none none reverse"
        }
    });

    // 图片或图标渐入
    gsap.from(".card > div", {
        opacity: 0,
        scale: 0.5,
        rotation: -10,
        duration: 0.6,
        ease: "back.out(1.7)",
        stagger: 0.2,
        scrollTrigger: {
            trigger: '.card',
            start: "top 85%",
            toggleActions: "play none none reverse"
        }
    });
</script>

</body>
</html>
